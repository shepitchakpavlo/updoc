# Локальний дев-зріз TB-0: Postgres (схема/стан) + MinIO (S3-емулятор для Phase 1,
# реалізація TemporaryStorage — поза TB-0).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: updoc
      POSTGRES_PASSWORD: updoc
      POSTGRES_DB: updoc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U updoc -d updoc"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: updoc
      MINIO_ROOT_PASSWORD: updoc-updoc
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
